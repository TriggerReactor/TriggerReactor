plugins {
    id 'org.spongepowered.plugin' version '0.8.1'
}

sponge {
    plugin {
        meta {
            id = project.ext.id.toLowerCase()
            version = project.ext.version
            description = project.ext.description
        }
    }
}

repositories {
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
}

dependencies {
    compile project(":core")
    compile "org.bstats:bstats-sponge-lite:1.4"

    implementation fileTree(dir: "libs", includes: ['*.jar'])
    implementation 'org.spongepowered:spongeapi:7.2.+'

    testCompile project(':core').sourceSets.test.output
}

jar {
    from {
        String[] include = [
                "bstats-sponge-lite-1.4.jar",
                "${project(':core').archivesBaseName}-${project.version}.jar",
                "commons-lang3-3.12.0.jar",

                // graaljs
                "js-language-24.1.0.jar",
                "polyglot-24.1.0.jar",
                "regex-24.1.0.jar",
                "collections-24.1.0.jar",
                "jniutils-24.1.0.jar",
                "nativeimage-24.1.0.jar",
                "word-24.1.0.jar",
                "icu4j-24.1.0.jar",
                "truffle-api-24.1.0.jar",
                "truffle-compiler-24.1.0.jar",
                "truffle-runtime-24.1.0.jar"
        ]

        configurations.compile
                .findAll { include.contains(it.name) }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
}